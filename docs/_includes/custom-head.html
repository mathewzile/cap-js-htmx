<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs';
  // kramdown + rouge turn a ```mermaid fence into <div class="language-mermaid ..."><div class="highlight"><pre><code>...</code></pre></div></div>
  document.querySelectorAll('.language-mermaid, pre > code.language-mermaid').forEach(block => {
    const code = block.matches('code') ? block : block.querySelector('code');
    if (!code) return;
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    (block.matches('code') ? block.parentElement : block).replaceWith(div);
  });
  mermaid.initialize({ startOnLoad: false, securityLevel: 'strict' });
  await mermaid.run();
</script>
